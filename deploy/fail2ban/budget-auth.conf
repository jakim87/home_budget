# Filtr fail2ban dla nieudanych logowań do aplikacji budżetowej.
# Instalacja: /etc/fail2ban/filter.d/budget-auth.conf
#
# Dopasowuje wpisy z app/blueprints/auth_bp.py, format loggera:
#   %(asctime)s %(levelname)s [%(name)s] %(message)s   (datefmt %Y-%m-%d %H:%M:%S)
# Przykład linii:
#   2026-08-24 13:34:52 WARNING [app.blueprints.auth_bp] Nieudana próba logowania: 'nikt' (IP=1.2.3.4)
#
# UWAGA: adres w logu jest prawdziwy tylko przy TRUST_PROXY=1 w środowisku
# aplikacji. Bez tego za nginx-em każdy wpis pokazuje 127.0.0.1 i jail nie ma
# czego banować.

[Definition]
failregex = ^\s*\S+ \S+ WARNING \[app\.blueprints\.auth_bp\] Nieudana próba logowania: .* \(IP=<HOST>\)\s*$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
