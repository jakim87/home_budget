# Filtr fail2ban dla nieudanych logowan do aplikacji budzetowej.
# Instalacja: /etc/fail2ban/filter.d/budget-auth.conf
#
# Dopasowuje wpisy z app/blueprints/auth_bp.py, format loggera:
#   %(asctime)s %(levelname)s [%(name)s] %(message)s   (datefmt %Y-%m-%d %H:%M:%S)
# Przyklad linii:
#   2026-08-24 13:34:52 WARNING [app.blueprints.auth_bp] Nieudana proba logowania: 'nikt' (IP=1.2.3.4)
#
# WAZNE: fail2ban usuwa znacznik czasu (datepattern) z linii ZANIM zastosuje
# failregex, wiec wzorzec NIE moze zaczynac sie od dopasowania daty. Wczesniejsza
# wersja z "^\s*\S+ \S+ WARNING ..." nie lapala nic (Failregex: 0 total) —
# po odcieciu daty nie bylo czego dopasowac. Kotwiczymy na fragmencie loggera.
#
# failregex jest ASCII-only (Nieudana.* zamiast "Nieudana proba logowania:").
# "Nieudana" na WARNING loguje wylacznie auth_bp, wiec wzorzec jest jednoznaczny.
#
# UWAGA: adres w logu jest prawdziwy tylko przy TRUST_PROXY=1. Bez tego za nginx-em
# kazdy wpis pokazuje 127.0.0.1 i jail nie ma czego banowac.

[Definition]
failregex = \[app\.blueprints\.auth_bp\] Nieudana.* \(IP=<HOST>\)
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
