# CI jakości: trzy bramki uzupełniające pakiet testów (tests.yml).
#   1. ruff          — linter (E9 + Pyflakes); łapie nieużywane importy,
#                      niezdefiniowane nazwy i błędy składni. Konfiguracja: ruff.toml.
#   2. migracje-drift — pilnuje, że modele SQLAlchemy są zgodne z migracjami
#                      Alembica. `flask db check` zwraca kod ≠0, gdy ktoś zmienił
#                      model, ale nie wygenerował migracji (albo odwrotnie).
#   3. testy-js      — vitest na modułach z app/static/js. Dashboard i Raporty
#                      liczą sumy w przeglądarce, więc pytest tej ścieżki nie
#                      dotyka w ogóle — bez tej bramki liczby oglądane przez
#                      użytkownika nie są pokryte niczym.
name: Jakość

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: ruff (linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalacja lintera
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

  migracje-drift:
    name: drift modeli vs migracje
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budget_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # flask db upgrade/check używa produkcyjnego Config → czyta DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/budget_ci
      FLASK_APP: run.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Zastosuj migracje (baza do HEAD)
        run: flask db upgrade

      - name: Wykryj drift (modele bez wygenerowanej migracji)
        run: flask db check

  testy-js:
    name: vitest (liczenie na froncie)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zależności testowych
        run: npm ci

      - name: vitest
        run: npm test
